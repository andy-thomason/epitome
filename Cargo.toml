[package]
name = "epitome"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/andy-thomason/epitome"

[dependencies]
epitome-ir = { path = "ir" }
epitome-opt = { path = "opt" }
epitome-codegen = { path = "codegen" }
epitome-mlir = { path = "mlir" }

[workspace]
members = ["ir", "opt", "codegen", "mlir", "sv", "epitome-rustc2"]

# The SystemVerilog front end and interpreter are only useful optimised,
# so even plain `cargo test` and `cargo run` builds of it are.
[profile.dev.package.epitome-sv]
opt-level = 3
