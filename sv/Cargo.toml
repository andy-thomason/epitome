[package]
name = "epitome-sv"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/andy-thomason/epitome"
description = "A SystemVerilog (IEEE 1800-2023) compiler: lexer, preprocessor, parser, elaborator and simulator"

[dependencies]
# The netlist is built as Epitome IR, which `model` optimises, compiles and
# loads into the process.
epitome-ir = { path = "../ir" }
epitome-opt = { path = "../opt" }
epitome-codegen = { path = "../codegen" }

[[bin]]
name = "epitome-sv"
path = "src/main.rs"
